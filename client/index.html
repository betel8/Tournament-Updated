<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon (Google prefers PNG + ICO) -->

    <link rel="icon" href="/favicon.ico" />

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="/favicon.png" sizes="180x180">

    <!-- Windows Tile -->
    <meta name="msapplication-TileImage" content="/favicon.png">

    <!-- Mobile Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Page Title -->
    <title>PlayZon Game Zone | FC 26 Tournament Addis Ababa</title>

    <!-- Meta Description (Shown under Google search result) -->
    <meta
      name="description"
      content="PlayZon Game Zone Addis Ababa – Check FC26 tournament schedules, match results, scores, and register for upcoming competitions. Fun, friendly, and competitive gaming community in Ethiopia."
    />

    <!-- Keywords for SEO -->
    <meta
      name="keywords"
      content="PlayZon, PlayZon Game Zone, FC26 tournament Ethiopia, Addis Ababa gaming, PS5 tournament, CyberHub tournament, football game competition, match results, gaming zone Addis Ababa"
    />

    <!-- Open Graph (for Facebook, WhatsApp, Telegram preview) -->
    <meta property="og:title" content="PlayZon Game Zone – FC26 Tournament Addis Ababa" />

    <meta property="og:image" content="https://www.playzon.org.et/favicon.png" />
    <meta property="og:url" content="https://www.playzon.org.et" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="PlayZon Game Zone – FC26 Tournament" />
    <meta name="twitter:description" content="Check tournament results, scores, and match schedules." />
    <meta name="twitter:image" content="https://www.playzon.org.et/favicon.png" />

    <!-- Schema.org: Website -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "PlayZon Game Zone",
      "url": "https://www.playzon.org.et",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://www.playzon.org.et/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Schema.org: Organization -->
